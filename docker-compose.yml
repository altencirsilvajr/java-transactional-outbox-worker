services:
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_DB: outbox
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - outbox-postgres:/var/lib/postgresql/data

  kafka:
    image: redpandadata/redpanda:v25.1.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/outbox
      DB_USER: outbox
      DB_PASSWORD: outbox
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ORIGINS: http://localhost:8088
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build: frontend
    ports:
      - "8088:8080"
    depends_on:
      - api

volumes:
  outbox-postgres:
