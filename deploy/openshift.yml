apiVersion: v1
kind: ConfigMap
metadata:
  name: outbox-api-config
data:
  DB_URL: jdbc:postgresql://postgresql:5432/outbox
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CORS_ORIGINS: https://outbox-ui.apps.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: outbox-api }
  template:
    metadata:
      labels: { app: outbox-api }
    spec:
      containers:
        - name: api
          image: quay.io/example/java-transactional-outbox-worker:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: outbox-api-config }
            - secretRef: { name: outbox-api-secrets }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-api
spec:
  selector: { app: outbox-api }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: outbox-api
spec:
  to: { kind: Service, name: outbox-api }
  port: { targetPort: 8080 }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
